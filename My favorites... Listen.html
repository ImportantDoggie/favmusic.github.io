<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My favorites... Listen</title>
<style>
:root{--bg:#f0e3cd;--paper:#f9f0e0;--ink:#2b1c12;--mut:#7c6650;--acc:#b4532a;--acc2:#c9953a;--line:rgba(43,28,18,.16);--sh:0 12px 30px rgba(70,40,15,.22);--onacc:#fff8ec;
 color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b130e;--paper:#271b13;--ink:#f3e6cf;--mut:#b5a088;--acc:#d9693a;--acc2:#d9a64a;--line:rgba(243,230,207,.16);--sh:0 12px 30px rgba(0,0,0,.5);--onacc:#1b130e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b130e;--paper:#271b13;--ink:#f3e6cf;--mut:#b5a088;--acc:#d9693a;--acc2:#d9a64a;--line:rgba(243,230,207,.16);--sh:0 12px 30px rgba(0,0,0,.5);--onacc:#1b130e;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;overflow-x:hidden}
.serif{font-family:Georgia,"Iowan Old Style","Times New Roman",serif}
.wrap{max-width:1200px;margin:0 auto;padding:clamp(28px,6vw,80px) clamp(20px,4vw,56px)}
h1{font-size:clamp(44px,8.5vw,112px);line-height:.98;margin:0 0 clamp(36px,7vw,80px);font-weight:700;letter-spacing:-.02em}
h1 i{color:var(--acc);font-weight:400}
.lead{font-size:clamp(17px,2vw,21px);color:var(--mut);max-width:40ch;margin:0 0 clamp(36px,7vw,80px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:48px 60px;padding-right:30px}
.u{position:relative;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .3s}
.u:hover,.u:focus-visible{z-index:5;transform:translateY(-4px)}
.u:focus-visible,.x:focus-visible,.nv:focus-visible,.ln a:focus-visible{outline:2px solid var(--acc2);outline-offset:4px}
.pair{position:relative;aspect-ratio:1}
.sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:3px;box-shadow:var(--sh);z-index:2;display:block}
.disc{position:absolute;top:3%;left:3%;width:94%;height:94%;z-index:1;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.rot{width:100%;height:100%;border-radius:50%;background:repeating-radial-gradient(circle,#15100c 0 2px,#241a13 2px 3px);box-shadow:0 8px 20px rgba(0,0,0,.4);position:relative}
.rot::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 20deg,rgba(255,255,255,.16),transparent 22%,rgba(255,255,255,.1) 50%,transparent 72%,rgba(255,255,255,.16))}
.lb{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background-size:cover;background-position:center;z-index:1}
.lb::after{content:"";position:absolute;left:44%;top:44%;width:12%;height:12%;border-radius:50%;background:#15100c}
.u:hover .disc,.u:focus-visible .disc{transform:translateX(26%)}
.u b{display:block;margin-top:14px;font-size:18px;font-family:Georgia,serif}.u span{display:block;font-size:14px;color:var(--mut)}
.ft{margin-top:clamp(40px,8vw,96px);color:var(--mut);font-size:14px}
/* окно альбома */
.md{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(20,12,7,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
.md.on{display:flex}
.card{position:relative;background:var(--paper);border-radius:24px;box-shadow:var(--sh);padding:clamp(20px,4vw,44px);max-width:1000px;width:100%;margin:auto;display:flex;gap:clamp(24px,4vw,48px);align-items:center;flex-wrap:wrap;justify-content:center}
.big{position:relative;width:min(68vw,360px);aspect-ratio:1;flex:none;margin-right:min(30vw,140px)}
.big .sl{z-index:2}.big .disc{transform:translateX(0)}.md.on .big .disc.out{transform:translateX(46%)}
.big .rot.spin{animation:sp 3.4s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.info{flex:1 1 300px;min-width:0}
.info h3{font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0 0 4px}.info .by{margin:0 0 16px;color:var(--mut)}
.tl{margin:0 0 18px;padding:0;list-style:none;max-height:min(36vh,330px);overflow:auto;border-top:1px solid var(--line)}
.tl li{display:flex;gap:12px;padding:6px 4px;font-size:15px;border-bottom:1px solid var(--line)}
.tl .n{width:22px;text-align:right;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.tl .dk{display:block;color:var(--acc);font-size:12px;font-weight:700;letter-spacing:.05em;border:0;padding:10px 4px 2px}
.ln{display:flex;flex-wrap:wrap;gap:8px}
.ln a{color:var(--onacc);background:var(--acc);text-decoration:none;border-radius:999px;padding:10px 18px;font-weight:600;font-size:15px}
.ln a.o{background:transparent;color:var(--ink);border:1px solid var(--line)}
.x,.nv{position:absolute;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer}
.x{top:14px;right:14px}.nv.p{left:-8px;top:50%}.nv.n{right:-8px;top:50%}
@media (max-width:700px){.nv.p{left:6px;top:8px}.nv.n{left:54px;right:auto;top:8px}.card{padding-top:64px}}
@media (prefers-reduced-motion:reduce){.disc,.u{transition:none}.big .rot.spin{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1 class="serif">My favorites<i>... Listen</i></h1>
  <div class="grid" id="grid"></div>
</main>

<div class="md" id="md" role="dialog" aria-modal="true" aria-label="Альбом">
  <div class="card">
    <button class="x" id="x" aria-label="Закрыть">✕</button>
    <button class="nv p" id="pv" aria-label="Предыдущий альбом">‹</button><button class="nv n" id="nx" aria-label="Следующий альбом">›</button>
    <div class="big"><div class="disc" id="bd"><div class="rot" id="br"><i class="lb" id="bl"></i></div></div><img class="sl" id="bi" alt=""></div>
    <div class="info"><h3 class="serif" id="t"></h3><p class="by" id="a"></p><ol class="tl" id="tl"></ol><div class="ln" id="ln"></div></div>
  </div>
</div>
